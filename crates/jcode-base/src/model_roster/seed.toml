[aliases.expensive-expert]
description = "Hard architecture, debugging dead ends, and final review where quality outweighs cost."
models = ["claude-oauth:claude-fable-5", "openai-oauth:gpt-6-astra"]
default_effort = "max"

[aliases.architect]
description = "Architecture, design, investigation, debugging, review, and verification."
models = ["claude-oauth:claude-fable-5", "openai-oauth:gpt-6-astra"]
