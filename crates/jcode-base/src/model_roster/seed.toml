[aliases.coder]
description = "Substantial implementation work in an existing codebase."
models = ["openai-oauth:gpt-6-astra", "claude-oauth:claude-opus-5"]
default_effort = "xhigh"

[aliases.researcher]
description = "Isolated research, source gathering, bulk reading, and synthesis."
models = ["openai-oauth:gpt-6-astra", "claude-oauth:claude-opus-5"]
default_effort = "low"

[aliases.fast-worker]
description = "Fast lower-cost isolated work that does not need frontier reasoning."
models = ["openai-oauth:gpt-5.6-terra"]
